<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Domotique 360 PRO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100vh; width: 100vw; margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            font-family: 'Inter', sans-serif;
            color: white;
            overflow: hidden;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(255, 119, 198, 0.08) 0%, transparent 50%);
            animation: gradientShift 15s ease infinite;
            pointer-events: none;
        }
        @keyframes gradientShift {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.1); }
        }
        #plan-wrapper {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            overflow: hidden;
        }
        #plan-container {
            position: absolute; top: 120px; left: 300px; right: 350px; bottom: 100px;
            display: flex; justify-content: center; align-items: center;
            animation: fadeInScale 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        #plan-img {
            max-height: 100%; max-width: 100%; width: auto; height: auto; object-fit: contain;
            border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 100px rgba(120, 119, 198, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1); transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #plan-img.fading { opacity: 0; transform: scale(0.92) translateY(20px); filter: blur(15px); }
        #panorama {
            width: 100% !important; height: 100% !important; border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.1);
            display: none; position: absolute; top: 0; left: 0;
            background: #000;
        }
        #panorama.active { display: block; }
        #plan-img.hidden { visibility: hidden; }
        svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; border-radius: 24px; }
        .zone-poly { fill: #7877c6; fill-opacity: 0; cursor: pointer; pointer-events: all; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .zone-poly:hover { fill-opacity: 0.2; stroke: rgba(255, 255, 255, 0.6); stroke-width: 2; filter: drop-shadow(0 0 20px rgba(120, 119, 198, 0.5)); }
        .custom-hotspot {
            height: 30px; width: 30px; background: rgba(102, 126, 234, 0.8); border: 3px solid white;
            border-radius: 50%; cursor: pointer; box-shadow: 0 0 20px rgba(102, 126, 234, 0.6);
        }
        .custom-hotspot::after {
            content: ''; position: absolute; top: -3px; left: -3px; right: -3px; bottom: -3px;
            border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.5);
            animation: pulse-hotspot 2s ease-in-out infinite; pointer-events: none;
        }
        @keyframes pulse-hotspot {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); transition: all 0.3s ease;
        }
        .glass-card:hover { background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.25); transform: translateY(-2px); }
        .glass-header {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1100;
            width: calc(100% - 600px); display: flex; justify-content: space-between; align-items: center; padding: 15px 30px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-header:hover { transform: translateX(-50%) translateY(-2px); }
        .header-left { display: flex; flex-direction: column; }
        .welcome-text {
            font-size: 1.25rem; font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.7) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .date-text { font-size: 0.75rem; color: rgba(255, 255, 255, 0.5); text-transform: uppercase; letter-spacing: 1px; }
        .header-center { text-align: center; }
        .clock-text { font-size: 1.5rem; font-weight: 800; letter-spacing: 2px; }
        .header-right { display: flex; align-items: center; gap: 15px; }
        .weather-info {
            display: flex; align-items: center; gap: 10px; background: rgba(255, 255, 255, 0.05);
            padding: 8px 15px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .weather-icon { font-size: 1.25rem; }
        .weather-temp { font-weight: 600; }
        .room-selector { position: fixed; top: 100px; left: 30px; z-index: 1000; max-width: 200px; }
        .room-header { padding: 20px; text-align: center; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .room-title {
            font-size: 0.75rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
            color: rgba(255, 255, 255, 0.5); margin-bottom: 8px;
        }
        .room-count {
            font-size: 1.5rem; font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .room-list { padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .btn-room {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7); padding: 12px 20px; border-radius: 12px;
            font-size: 0.875rem; font-weight: 500; text-align: left; transition: all 0.3s ease;
            position: relative; overflow: hidden;
        }
        .btn-room::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent); transition: 0.5s;
        }
        .btn-room:hover::before { left: 100%; }
        .btn-room:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.3); color: white; transform: translateX(5px); }
        .btn-room.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: rgba(255, 255, 255, 0.3); color: white; box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        #status-panel {
            position: fixed; top: 100px; right: 30px; z-index: 1000; min-width: 280px;
            display: flex; flex-direction: column; gap: 15px;
        }
        .temp-card { padding: 25px; }
        .temp-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
        .temp-icon {
            width: 50px; height: 50px; background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 15px; display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; box-shadow: 0 4px 15px rgba(245, 87, 108, 0.3);
        }
        .temp-info { flex: 1; margin-left: 15px; }
        .temp-label {
            font-size: 0.75rem; color: rgba(255, 255, 255, 0.5); font-weight: 500;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .temp-value {
            font-size: 2.5rem; font-weight: 700;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            line-height: 1; margin-top: 5px;
        }
        .temp-target {
            display: flex; align-items: center; justify-content: space-between; padding: 15px;
            background: rgba(255, 255, 255, 0.05); border-radius: 12px; margin-top: 15px;
            cursor: pointer; transition: all 0.3s ease;
        }
        .temp-target:hover { background: rgba(255, 255, 255, 0.08); transform: translateX(-3px); }
        .target-label { font-size: 0.875rem; color: rgba(255, 255, 255, 0.6); }
        .target-value { font-size: 1.25rem; font-weight: 600; color: white; }
        .window-card { padding: 20px; display: flex; align-items: center; justify-content: space-between; }
        .window-status { display: flex; align-items: center; gap: 12px; }
        .window-icon {
            width: 45px; height: 45px; border-radius: 12px; display: flex; align-items: center;
            justify-content: center; font-size: 1.25rem; transition: all 0.3s ease;
        }
        .window-closed .window-icon {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.3);
        }
        .window-open .window-icon {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            box-shadow: 0 4px 15px rgba(250, 112, 154, 0.3); animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .window-text { flex: 1; }
        .window-label {
            font-size: 0.75rem; color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase; letter-spacing: 1px;
        }
        .window-state { font-size: 1rem; font-weight: 600; margin-top: 3px; }
        .eve-card {
            padding: 20px; cursor: pointer; transition: all 0.3s ease;
            position: relative; overflow: hidden;
        }
        .eve-card::before {
            content: ''; position: absolute; top: 50%; left: 50%; width: 0; height: 0;
            border-radius: 50%; background: rgba(255, 255, 255, 0.1);
            transform: translate(-50%, -50%); transition: width 0.6s, height 0.6s;
        }
        .eve-card:active::before { width: 300px; height: 300px; }
        .eve-content { display: flex; align-items: center; gap: 15px; position: relative; z-index: 1; }
        .eve-icon {
            width: 50px; height: 50px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px; display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .eve-text { flex: 1; }
        .eve-label {
            font-size: 0.75rem; color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase; letter-spacing: 1px;
        }
        .eve-title { font-size: 1.125rem; font-weight: 600; margin-top: 3px; }
        .eve-arrow { font-size: 1.5rem; color: rgba(255, 255, 255, 0.3); transition: all 0.3s ease; }
        .eve-card:hover .eve-arrow { color: white; transform: translateX(5px); }
        #thermo-panel {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9);
            opacity: 0; pointer-events: none; z-index: 2000;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); max-width: 400px; width: 90%;
        }
        #thermo-panel.active { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: all; }
        .thermo-backdrop {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px);
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 1999;
        }
        .thermo-backdrop.active { opacity: 1; pointer-events: all; }
        .thermo-content { padding: 30px; }
        .thermo-header { text-align: center; margin-bottom: 30px; }
        .thermo-title {
            font-size: 0.875rem; color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px;
        }
        .thermo-subtitle { font-size: 1.5rem; font-weight: 600; }
        .thermo-controls { display: flex; align-items: center; justify-content: center; gap: 30px; margin: 30px 0; }
        .thermo-btn {
            width: 60px; height: 60px; border-radius: 50%; border: none; font-size: 1.5rem;
            font-weight: 600; color: white; cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        .thermo-btn.minus { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .thermo-btn.plus { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
        .thermo-btn:hover { transform: scale(1.1); }
        .thermo-btn:active { transform: scale(0.95); }
        .thermo-display {
            font-size: 4rem; font-weight: 700; text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .thermo-actions { display: flex; gap: 10px; margin-top: 30px; }
        .btn-thermo {
            flex: 1; padding: 15px; border: none; border-radius: 12px;
            font-weight: 600; font-size: 0.875rem; cursor: pointer; transition: all 0.3s ease;
        }
        .btn-thermo.cancel { background: rgba(255, 255, 255, 0.1); color: white; }
        .btn-thermo.confirm {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-thermo:hover { transform: translateY(-2px); }
        .edit-controls {
            position: fixed; bottom: 30px; right: 30px; z-index: 1000;
            display: flex; flex-direction: column; gap: 10px; align-items: flex-end;
        }
        .btn-edit {
            padding: 12px 24px; border: none; border-radius: 12px; font-weight: 600;
            font-size: 0.875rem; cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        .btn-edit.primary { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; }
        .btn-edit.success { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color: white; }
        .btn-edit.view360 { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-edit:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3); }
        #draw-line { stroke: #ff4444; stroke-width: 2; fill: rgba(255, 68, 68, 0.2); stroke-dasharray: 5; pointer-events: none; }
        .modal-content { background: white; color: black; }
        .menu-toggle {
            display: none; position: fixed; top: 15px; left: 15px; z-index: 2100;
            width: 50px; height: 50px; border-radius: 12px;
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2); align-items: center;
            justify-content: center; cursor: pointer; font-size: 1.5rem; color: white;
        }
        .mobile-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px); z-index: 1999;
        }
        .mobile-overlay.active { display: block; }
        @media (max-width: 768px) {
            .menu-toggle { display: flex; }
            body { overflow-y: auto; }
            .glass-header { position: relative; width: 100%; top: 0; left: 0; transform: none; border-radius: 0 0 20px 20px; padding: 15px; }
            .glass-header:hover { transform: translateY(-2px); }
            .header-left { display: none; }
            .room-selector { position: fixed; left: -100%; top: 0; width: 250px; height: 100vh; z-index: 2000; transition: left 0.3s ease; max-width: none; }
            .room-selector.open { left: 0; }
            #status-panel {
                position: fixed; top: auto; bottom: 0; left: 0; right: 0; width: 100%;
                flex-direction: row; gap: 10px; padding: 10px; background: rgba(15, 12, 41, 0.95);
                backdrop-filter: blur(20px); border-top: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 20px 20px 0 0; overflow-x: auto; z-index: 900; min-width: auto;
            }
            .temp-card, .window-card, .eve-card { min-width: 180px; flex-shrink: 0; padding: 15px; }
            #plan-wrapper {
                padding: 20px 10px 180px 10px;
                height: auto;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
            }
            #plan-container {
                position: relative;
                top: 0; left: 0; right: 0; bottom: 0;
                width: 100%;
                height: auto;
                min-height: 300px;
                margin-top: 20px;
            }
            #panorama { height: 50vh; position: relative; }
            #plan-img { width: 100%; height: auto; max-height: none; }
            .edit-controls { bottom: 190px; right: 10px; gap: 8px; }
        }
    </style>
</head>
<body>

<div class="menu-toggle" onclick="toggleMobileMenu()"><i class="fas fa-bars"></i></div>
<div class="mobile-overlay" onclick="toggleMobileMenu()"></div>

<div class="glass-header glass-card">
    <div class="header-left">
        <div id="greeting" class="welcome-text">Bonjour</div>
        <div id="date-now" class="date-text">-- --- ----</div>
    </div>
    <div class="header-center"><div id="clock" class="clock-text">00:00</div></div>
    <div class="header-right">
        <div class="weather-info">
            <span id="weather-icon" class="weather-icon">☁️</span>
            <span id="weather-temp" class="weather-temp">--°C</span>
        </div>
    </div>
</div>

<div class="room-selector glass-card">
    <div class="room-header">
        <div class="room-title">Ma Maison</div>
        <div id="room-count" class="room-count">5 Pièces</div>
    </div>
    <div id="room-list" class="room-list"></div>
</div>

<div id="plan-wrapper">
    <div id="plan-container">
        <img src="Cuisine.jpg" id="plan-img" alt="Plan">
        <div id="panorama"></div>
        <svg id="svg-overlay" onclick="handleMapClick(event)">
            <polyline id="draw-line" points=""></polyline>
        </svg>
    </div>
</div>

<div id="status-panel">
    <div class="glass-card temp-card">
        <div class="temp-header">
            <div class="temp-info">
                <div class="temp-label">Température</div>
                <div id="txt-temp" class="temp-value">--°C</div>
            </div>
            <div class="temp-icon">🌡️</div>
        </div>
        <div class="temp-target" onclick="toggleThermo()">
            <span class="target-label">Consigne</span>
            <span id="txt-target" class="target-value">--°C</span>
        </div>
    </div>
    <div class="glass-card window-card">
        <div id="window-status-container" class="window-status window-closed">
            <div class="window-icon">🪟</div>
            <div class="window-text">
                <div class="window-label">Fenêtres</div>
                <div id="window-state" class="window-state">Fermées</div>
            </div>
        </div>
    </div>
    <div class="glass-card eve-card" onclick="launchEve()">
        <div class="eve-content">
            <div class="eve-icon">🤖</div>
            <div class="eve-text">
                <div class="eve-label">Robot Aspirateur</div>
                <div id="eve-title" class="eve-title">Lancer EVE</div>
            </div>
            <div class="eve-arrow">→</div>
        </div>
    </div>
</div>

<div class="thermo-backdrop" onclick="toggleThermo()"></div>
<div id="thermo-panel" class="glass-card">
    <div class="thermo-content">
        <div class="thermo-header">
            <div class="thermo-title">Réglage</div>
            <div id="thermo-subtitle" class="thermo-subtitle">Température Cible</div>
        </div>
        <div class="thermo-controls">
            <button class="thermo-btn minus" onclick="adjustTemp(-0.5)">-</button>
            <div id="set-val" class="thermo-display">20.0</div>
            <button class="thermo-btn plus" onclick="adjustTemp(0.5)">+</button>
        </div>
        <div class="thermo-actions">
            <button class="btn-thermo cancel" onclick="toggleThermo()">Annuler</button>
            <button class="btn-thermo confirm" onclick="setThermostat()">Valider</button>
        </div>
    </div>
</div>

<div class="edit-controls">
    <button id="btn-360" class="btn-edit view360" onclick="toggle360View()">
        <i class="fas fa-globe"></i> Vue 360°
    </button>
    <button id="btn-edit" class="btn-edit primary" onclick="toggleEdit()">
        <i class="fas fa-pen"></i> Modifier Plan
    </button>
    <button id="btn-save" class="btn-edit success" style="display: none;" onclick="saveToJSON()">
        <i class="fas fa-save"></i> Sauvegarder
    </button>
</div>

<div class="modal fade" id="configModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">Configuration</h5></div>
            <div class="modal-body">
                <input type="hidden" id="edit-idx">
                <input type="hidden" id="edit-type">
                <div class="mb-3">
                    <label class="form-label">Nom</label>
                    <input type="text" id="zone-name" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">URL ou Entité</label>
                    <input type="text" id="zone-url" class="form-control">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-danger me-auto" onclick="deleteItem()">Supprimer</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fermer</button>
                <button type="button" class="btn btn-primary" onclick="confirmItem()">OK</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="haModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content glass-card" style="background: rgba(15, 12, 41, 0.95); border: 1px solid rgba(255, 255, 255, 0.2);">
            <div class="modal-header border-0">
                <h5 class="modal-title" id="haModalTitle" style="color: white;">Action</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-0" style="height: 70vh;">
                <iframe id="haFrame" src="" style="width: 100%; height: 100%; border: none;"></iframe>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

<script>
let HA_URL, TOKEN, WEATHER_ENTITY, ROOMS = [];
let headers = {};

async function loadGlobalConfig() {
    try {
        const res = await fetch('config.json?t=' + Date.now());
        if (!res.ok) throw new Error("Fichier config.json introuvable");
        const config = await res.json();
        HA_URL = config.ha_url;
        TOKEN = config.ha_token;
        WEATHER_ENTITY = config.weather_entity;
        ROOMS = config.rooms.map(r => ({
            ...r,
            vacuum: r.vacuum_entity,
            window: r.window_entity
        }));
        headers = { "Authorization": `Bearer ${TOKEN}`, "Content-Type": "application/json" };
        return true;
    } catch(e) {
        console.error("Erreur chargement config.json:", e);
        return false;
    }
}

let curR = 0, zones = [], hotspots = [], currentPoints = [], editMode = false, is360Active = false, panoViewer = null;
const bModal = new bootstrap.Modal(document.getElementById('configModal'));
let haModalInstance = null;
let isSaving = false;

async function saveToJSON(silent = false) {
    if (isSaving) return;
    isSaving = true;
    const r = ROOMS[curR];
    const roomKey = r.n.toLowerCase();
    const btnSave = document.getElementById('btn-save');

    if (btnSave && !silent) btnSave.innerHTML = '<i class="fas fa-spinner fa-spin"></i>...';

    // 1. TENTATIVE SAUVEGARDE DIRECTE HA (Solution Propre sans PHP)
    try {
        const config = await fetch('config.json?t=' + Date.now()).then(r => r.json());
        const target_entity = config.persistence_entity || 'input_boolean.storage_hotspots_360';

        // On récupère l'état actuel pour fusionner les attributs
        const current = await getEntityState(target_entity);
        let attributes = current ? (current.attributes || {}) : {};

        // On nettoie les attributs internes HA
        delete attributes.friendly_name;
        delete attributes.icon;

        // On met à jour la pièce actuelle
        attributes[roomKey] = { zones: zones, hotspots: hotspots };

        const payload = { state: 'on', attributes: attributes };

        const resHA = await fetch(`${HA_URL}/api/states/${target_entity}`, {
            method: 'POST',
            headers: headers,
            body: JSON.stringify(payload)
        });

        if (resHA.ok) {
            console.log("✅ Sauvegarde Directe HA réussie");
            if (!silent) { alert(`✅ Sauvegardé (Attributs HA) pour ${r.n} !`); toggleEdit(); }
            isSaving = false;
            if (btnSave && !silent) btnSave.innerHTML = '<i class="fas fa-save"></i> Sauvegarder';
            return;
        }
    } catch (e) {
        console.warn("⚠️ Échec sauvegarde directe HA, tentative PHP local...");
    }

    // 2. TENTATIVE PHP LOCAL (Fallback si supporté)
    try {
        const payloadPHP = { room: roomKey, zones: zones, hotspots: hotspots };
        const res = await fetch('save_hotspots.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payloadPHP)
        });

        const data = await res.json();
        if (data.status === 'success') {
            console.log("✅ Sauvegarde locale PHP réussie");
            if (!silent) { alert(`✅ Sauvegardé (PHP) pour ${r.n} !`); toggleEdit(); }
        }
    } catch (e2) {
        console.error("❌ ÉCHEC TOTAL DE SAUVEGARDE:", e2);
        if (!silent) alert("🚨 IMPOSSIBLE DE SAUVEGARDER\nLa sauvegarde HA et PHP ont échoué.");
    } finally {
        isSaving = false;
        if (btnSave && !silent) btnSave.innerHTML = '<i class="fas fa-save"></i> Sauvegarder';
    }
}

async function loadFromJSON() {
    const r = ROOMS[curR];
    const roomKey = r.n.toLowerCase();

    // 1. Essayer HA (Attributs) d'abord - Source de vérité préférée
    try {
        const config = await fetch('config.json?t=' + Date.now()).then(r => r.json());
        const target_entity = config.persistence_entity || 'input_boolean.storage_hotspots_360';
        const state = await getEntityState(target_entity);

        if (state && state.attributes && state.attributes[roomKey]) {
            const data = state.attributes[roomKey];
            const configData = typeof data === 'string' ? JSON.parse(data) : data;
            zones = configData.zones || [];
            hotspots = configData.hotspots || [];
            console.log(`📂 Chargé via Attributs HA (${roomKey})`);
            return;
        }
    } catch (e) {
        console.warn("⚠️ Impossible de charger via HA, tentative PHP...");
    }

    // 2. Fallback: charger via PHP
    try {
        const fileName = `config_${roomKey}.json`;
        const res = await fetch(`${fileName}?t=${Date.now()}`);
        if (res.ok) {
            const data = await res.json();
            zones = data.zones || [];
            hotspots = data.hotspots || [];
            console.log(`📂 Chargé via PHP (${roomKey})`);
        } else {
            zones = []; hotspots = [];
            console.log(`📂 Aucune config trouvée pour ${roomKey}`);
        }
    } catch(e2) {
        zones = []; hotspots = [];
    }
}

async function callHA(domain, service, data) {
    try {
        // Direct fetch si headers dispo, sinon proxy
        if (typeof headers !== 'undefined' && headers.Authorization) {
            await fetch(`${HA_URL}/api/services/${domain}/${service}`, {
                method: 'POST',
                headers: headers,
                body: JSON.stringify(data)
            });
        } else {
            await fetch(`api_ha.php?action=${service}&entity=${data.entity_id}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
        }
    } catch(e) { console.error("Error:", e); }
}

async function getEntityState(entity_id) {
    if (!entity_id) return null;
    try {
        // Direct fetch si headers dispo, sinon proxy
        if (typeof headers !== 'undefined' && headers.Authorization) {
            const res = await fetch(`${HA_URL}/api/states/${entity_id}`, { headers: headers });
            return res.ok ? await res.json() : null;
        } else {
            const res = await fetch(`api_ha.php?action=get_state&entity=${entity_id}`);
            return res.ok ? await res.json() : null;
        }
    } catch (e) { return null; }
}

function updateHeader() {
    const now = new Date();
    document.getElementById('clock').innerText = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    document.getElementById('date-now').innerText = now.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
    const hour = now.getHours();
    document.getElementById('greeting').innerText = hour >= 22 || hour < 5 ? "Douce nuit" : hour >= 18 ? "Bonsoir" : "Bonjour";
}

async function fetchWeather() {
    const state = await getEntityState(WEATHER_ENTITY);
    if (!state) return;
    document.getElementById('weather-temp').innerText = `${Math.round(state.attributes.temperature)}°C`;
    const icons = {
        'clear-night': '🌙', 'cloudy': '☁️', 'fog': '🌫️', 'sunny': '☀️',
        'rainy': '🌦️', 'snowy': '❄️', 'partlycloudy': '⛅'
    };
    document.getElementById('weather-icon').innerText = icons[state.state] || '🌡️';
}

function initRoomSelector() {
    document.getElementById('room-list').innerHTML = ROOMS.map((r, i) =>
        `<button class="btn-room ${i === curR ? 'active' : ''}" onclick="switchRoom(${i}, this)">${r.icon} ${r.n}</button>`
    ).join('');
    document.getElementById('room-count').innerText = `${ROOMS.length} Pièces`;
}

async function updateStatus() {
    const r = ROOMS[curR];
    const tState = await getEntityState(r.temp);
    if(tState) {
        const temp = parseFloat(tState.state);
        const el = document.getElementById('txt-temp');
        el.innerText = `${temp.toFixed(1)}°C`;
        const icon = document.querySelector('.temp-icon');
        if (temp >= 23) {
            icon.style.background = 'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)';
            el.style.background = 'linear-gradient(135deg, #ff0844 0%, #ffb199 100%)';
        } else if (temp <= 19) {
            icon.style.background = 'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)';
            el.style.background = 'linear-gradient(135deg, #2af598 0%, #009efd 100%)';
        } else {
            icon.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
            el.style.background = 'linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.7) 100%)';
        }
        el.style.webkitBackgroundClip = 'text';
        el.style.webkitTextFillColor = 'transparent';
    }
    const cState = await getEntityState(r.climate);
    if(cState) {
        const target = cState.attributes.temperature || "--";
        document.getElementById('txt-target').innerText = `${target}°C`;
        document.getElementById('set-val').innerText = parseFloat(target).toFixed(1);
    }
    if(r.window) {
        const wState = await getEntityState(r.window);
        const container = document.getElementById('window-status-container');
        const stateText = document.getElementById('window-state');
        if(wState && (wState.state === 'on' || wState.state === 'open')) {
            container.className = "window-status window-open";
            stateText.innerText = "Ouverte ⚠️";
        } else {
            container.className = "window-status window-closed";
            stateText.innerText = "Fermées";
        }
    }
}

async function switchRoom(idx, btn) {
    if (curR === idx && !btn) return;
    curR = idx;
    const r = ROOMS[curR];
    if(window.innerWidth <= 768) {
        document.querySelector('.room-selector').classList.remove('open');
        document.querySelector('.mobile-overlay').classList.remove('active');
    }
    document.querySelectorAll('.btn-room').forEach(b => b.classList.remove('active'));
    if(btn) btn.classList.add('active');
    const btn360 = document.getElementById('btn-360');
    if(r.img360) {
        btn360.style.display = 'block';
        btn360.innerHTML = '<i class="fas fa-globe"></i> Vue 360°';
    } else {
        btn360.style.display = 'none';
    }
    if(is360Active) toggle360View();
    const img = document.getElementById('plan-img');
    img.classList.add('fading');
    setTimeout(async () => {
        img.src = r.img;
        await loadFromJSON();
        await updateStatus();
        drawZones();
        img.onload = () => {
            img.classList.remove('fading');
            setTimeout(syncSVG, 50);
        };
        if (img.complete) {
            img.classList.remove('fading');
            syncSVG();
        }
        console.log(`📍 ${r.n} | Zones: ${zones.length} | Hotspots: ${hotspots.length}`);
    }, 400);
    document.getElementById('thermo-panel').classList.remove('active');
    document.querySelector('.thermo-backdrop').classList.remove('active');
}

function toggle360View() {
    const r = ROOMS[curR];
    if(!r.img360) { alert("Pas d'image 360°"); return; }
    is360Active = !is360Active;
    const img = document.getElementById('plan-img');
    const pano = document.getElementById('panorama');
    const svg = document.getElementById('svg-overlay');
    const btn = document.getElementById('btn-360');
    if(is360Active) {
        img.classList.add('hidden');
        svg.style.display = 'none';
        pano.classList.add('active');
        btn.innerHTML = '<i class="fas fa-map"></i> Plan 2D';
        initPannellum();
    } else {
        img.classList.remove('hidden');
        svg.style.display = 'block';
        pano.classList.remove('active');
        btn.innerHTML = '<i class="fas fa-globe"></i> Vue 360°';
        if(panoViewer) panoViewer.destroy();
        drawZones();
    }
}

function initPannellum() {
    if(panoViewer) panoViewer.destroy();
    console.log("🌐 Init Pannellum:", hotspots.length, "hotspots");
    panoViewer = pannellum.viewer('panorama', {
        "type": "equirectangular",
        "panorama": ROOMS[curR].img360,
        "autoLoad": true,
        "showControls": false,
        "hotSpots": hotspots.map((h, i) => ({
            pitch: parseFloat(h.pitch ?? h.pi ?? 0),
            yaw: parseFloat(h.yaw ?? h.y ?? 0),
            cssClass: 'custom-hotspot',
            clickHandlerFunc: () => editMode ? openConfig(i, '360') : handleAction(h)
        }))
    });
    panoViewer.on('mousedown', (e) => {
        if(!editMode) return;
        const c = panoViewer.mouseEventToCoords(e);
        if(c) {
            hotspots.push({ n: "Nouveau", pitch: c[0], yaw: c[1], u: "" });
            initPannellum();
            setTimeout(() => openConfig(hotspots.length - 1, '360'), 200);
        }
    });
}

function toggleThermo() {
    document.getElementById('thermo-panel').classList.toggle('active');
    document.querySelector('.thermo-backdrop').classList.toggle('active');
}

function adjustTemp(val) {
    const el = document.getElementById('set-val');
    let curr = parseFloat(el.innerText);
    curr = Math.max(5, Math.min(30, curr + val));
    el.innerText = curr.toFixed(1);
}

async function setThermostat() {
    const r = ROOMS[curR];
    const newTemp = parseFloat(document.getElementById('set-val').innerText);
    await callHA("climate", "set_temperature", { entity_id: r.climate, temperature: newTemp });
    toggleThermo();
    setTimeout(updateStatus, 1000);
}

async function launchEve() {
    const r = ROOMS[curR];
    await callHA("button", "press", { entity_id: r.vacuum });
    alert(`🤖 EVE en route pour ${r.n}!`);
}

function syncSVG() {
    const img = document.getElementById('plan-img');
    const svg = document.getElementById('svg-overlay');
    if(!img.clientWidth) return;
    svg.setAttribute("viewBox", `0 0 ${img.clientWidth} ${img.clientHeight}`);
    svg.style.width = img.clientWidth + "px";
    svg.style.height = img.clientHeight + "px";
    drawZones();
}

function handleMapClick(e) {
    if(!editMode || is360Active) return;
    const img = document.getElementById('plan-img');
    const rect = img.getBoundingClientRect();
    const x = Math.round(((e.clientX - rect.left) / rect.width) * 100);
    const y = Math.round(((e.clientY - rect.top) / rect.height) * 100);
    currentPoints.push(`${x},${y}`);
    updateDrawLine();
}

function updateDrawLine() {
    const img = document.getElementById('plan-img');
    const rect = img.getBoundingClientRect();
    const pts = currentPoints.map(p => {
        const [px, py] = p.split(',');
        return `${(px * rect.width) / 100},${(py * rect.height) / 100}`;
    }).join(' ');
    document.getElementById('draw-line').setAttribute("points", pts);
}

window.onkeydown = (e) => {
    if(e.key === "Enter" && editMode && !is360Active && currentPoints.length > 2) {
        zones.push({ n: "Nouveau", points: currentPoints.join(' '), u: "" });
        currentPoints = [];
        document.getElementById('draw-line').setAttribute("points", "");
        drawZones();
        openConfig(zones.length - 1, '2D');
    }
};

function drawZones() {
    const svg = document.getElementById('svg-overlay');
    const img = document.getElementById('plan-img');
    const line = document.getElementById('draw-line');
    svg.innerHTML = '';
    svg.appendChild(line);
    zones.forEach((z, i) => {
        const poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
        const pts = z.points.split(' ').map(p => {
            const [px, py] = p.split(',');
            return `${px * img.clientWidth / 100},${py * img.clientHeight / 100}`;
        }).join(' ');
        poly.setAttribute("points", pts);
        poly.setAttribute("class", "zone-poly");
        poly.onclick = (e) => { e.stopPropagation(); editMode ? openConfig(i, '2D') : handleAction(z); };
        svg.appendChild(poly);
    });
}

function toggleEdit() {
    editMode = !editMode;
    document.getElementById('btn-edit').innerText = editMode ? "Quitter" : "Modifier Plan";
    document.getElementById('btn-save').style.display = editMode ? "block" : "none";
    document.getElementById('svg-overlay').style.pointerEvents = editMode ? "all" : "none";
    currentPoints = [];
    updateDrawLine();
}

function openConfig(idx, type) {
    document.getElementById('edit-idx').value = idx;
    document.getElementById('edit-type').value = type || '2D';
    const item = (type === '360') ? hotspots[idx] : zones[idx];
    document.getElementById('zone-name').value = item.n || item.name;
    document.getElementById('zone-url').value = item.u || item.url || "";
    bModal.show();
}

function confirmItem() {
    const i = parseInt(document.getElementById('edit-idx').value);
    const type = document.getElementById('edit-type').value;
    const item = (type === '360') ? hotspots[i] : zones[i];
    item.n = document.getElementById('zone-name').value;
    item.u = document.getElementById('zone-url').value;
    bModal.hide();
    is360Active ? initPannellum() : drawZones();
    // Ne plus sauvegarder automatiquement - attendre le clic sur SAUVEGARDER
    console.log("✏️ Modification effectuée (non sauvegardée)");
}

function deleteItem() {
    const i = parseInt(document.getElementById('edit-idx').value);
    const type = document.getElementById('edit-type').value;
    if(type === '360') hotspots.splice(i, 1);
    else zones.splice(i, 1);
    bModal.hide();
    is360Active ? initPannellum() : drawZones();
    // Ne plus sauvegarder automatiquement - attendre le clic sur SAUVEGARDER
    console.log("🗑️ Suppression effectuée (non sauvegardée)");
}

async function handleAction(item) {
    const url = item.u || item.url;
    if(!url) return;
    if(url.includes('.') && !url.includes('/')) {
        await callHA('homeassistant', 'toggle', { entity_id: url });
    } else {
        if(!haModalInstance) haModalInstance = new bootstrap.Modal(document.getElementById('haModal'));
        document.getElementById('haModalTitle').innerText = item.n || item.name || "Action";
        document.getElementById('haFrame').src = url;
        haModalInstance.show();
    }
}

function toggleMobileMenu() {
    document.querySelector('.room-selector').classList.toggle('open');
    document.querySelector('.mobile-overlay').classList.toggle('active');
}

(async () => {
    const configLoaded = await loadGlobalConfig();
    if (!configLoaded) {
        alert("Erreur critique: Impossible de charger la configuration.");
        return;
    }
    initRoomSelector();
    await switchRoom(0);
    document.getElementById('haModal').addEventListener('hidden.bs.modal', () => {
        document.getElementById('haFrame').src = "";
    });
    updateHeader();
    fetchWeather();
    setInterval(updateHeader, 10000);
    setInterval(fetchWeather, 600000);
    setInterval(updateStatus, 30000);
    window.onresize = syncSVG;
})();
</script>
</body>
