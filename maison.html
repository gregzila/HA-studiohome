<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Studio Domotique 360 PRO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-hover: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-main: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.6);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            font-family: 'Inter', -apple-system, sans-serif;
            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
        }

        /* Glassmorphism Base */
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(25px) saturate(160%);
            -webkit-backdrop-filter: blur(25px) saturate(160%);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: all 0.3s ease;
        }

        /* Layout Containers */
        #main-view {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            padding: 110px 320px 100px 280px;
            z-index: 1;
        }

        #panorama-container {
            width: 100%;
            height: 100%;
            border-radius: 35px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid var(--glass-border);
            position: relative;
        }

        #panorama { width: 100%; height: 100%; }

        /* Header */
        .header-bar {
            position: fixed;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 60px);
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 35px;
        }

        .header-section { display: flex; align-items: center; gap: 20px; }
        .clock-text { font-size: 1.5rem; font-weight: 800; letter-spacing: 1px; }
        .greeting-text { font-size: 1.1rem; font-weight: 600; background: linear-gradient(to right, #fff, #a29bfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .weather-widget {
            background: rgba(255,255,255,0.05);
            padding: 8px 18px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid var(--glass-border);
        }

        /* Sidebars */
        .sidebar-left {
            position: fixed;
            top: 110px;
            left: 30px;
            width: 220px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar-right {
            position: fixed;
            top: 110px;
            right: 30px;
            width: 280px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Room Buttons */
        .btn-room {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: var(--text-dim);
            padding: 14px 20px;
            border-radius: 18px;
            text-align: left;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-room:hover {
            background: var(--glass-hover);
            transform: translateX(8px);
            color: white;
        }

        .btn-room.active {
            background: var(--primary);
            border-color: var(--secondary);
            color: white;
            box-shadow: 0 0 20px rgba(108, 92, 231, 0.4);
        }

        /* Status Cards */
        .status-card { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .status-header { display: flex; justify-content: space-between; align-items: center; color: var(--text-dim); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }
        .status-value { font-size: 1.8rem; font-weight: 700; color: white; }

        .status-footer {
            background: rgba(255,255,255,0.05);
            padding: 10px 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .status-footer:hover { background: rgba(255,255,255,0.1); }

        /* Bottom Controls */
        .bottom-controls {
            position: fixed;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            display: flex;
            gap: 15px;
            padding: 10px 25px;
            border-radius: 50px;
        }

        .btn-action {
            padding: 12px 28px;
            border-radius: 50px;
            border: none;
            font-weight: 700;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-edit { background: #4b5563; }
        .btn-edit.active { background: #ef4444; }
        .btn-save { background: #10b981; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }

        .btn-action:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .btn-action:active { transform: translateY(0); }

        /* Custom Pannellum Hotspot */
        .custom-hotspot {
            height: 32px;
            width: 32px;
            background: var(--primary);
            border: 3px solid white;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(108, 92, 231, 0.6);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .custom-hotspot:hover { transform: scale(1.3); background: var(--secondary); }

        .custom-hotspot::after {
            content: '';
            position: absolute;
            width: 100%; height: 100%;
            border-radius: 50%;
            border: 2px solid white;
            animation: pulse-ring 2s infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.8); opacity: 0; }
        }

        /* Thermostat Popup */
        #thermo-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(5px);
            z-index: 3000; display: none; align-items: center; justify-content: center;
        }
        .thermo-panel { width: 320px; padding: 30px; text-align: center; }
        .thermo-val { font-size: 4rem; font-weight: 800; margin: 20px 0; color: var(--primary); }
        .thermo-btn { width: 60px; height: 60px; border-radius: 50%; border: none; font-size: 1.5rem; cursor: pointer; background: var(--glass-hover); color: white; }

        /* Modal Overlays */
        #modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 4000; display: none;
        }
        #ha-modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90%; height: 85%; z-index: 4001; display: none;
            border-radius: 24px; overflow: hidden;
        }

        /* Utility */
        .loading-blur { filter: blur(10px); pointer-events: none; }
    </style>
</head>
<body>

    <!-- Header Bar -->
    <div class="header-bar glass-card">
        <div class="header-section">
            <div id="greeting" class="greeting-text">Chargement...</div>
            <div id="clock" class="clock-text">00:00</div>
        </div>
        <div class="header-section">
            <div class="weather-widget">
                <span id="weather-icon">☁️</span>
                <span id="weather-temp">--°C</span>
            </div>
        </div>
    </div>

    <!-- Left Sidebar: Rooms -->
    <div id="room-sidebar" class="sidebar-left">
        <!-- Dynamically filled -->
    </div>

    <!-- Main Content -->
    <div id="main-view">
        <div id="panorama-container">
            <div id="panorama"></div>
        </div>
    </div>

    <!-- Right Sidebar: Status -->
    <div class="sidebar-right">
        <!-- Temperature -->
        <div class="glass-card status-card">
            <div class="status-header">
                <span>Température</span>
                <i class="fas fa-thermometer-half"></i>
            </div>
            <div id="txt-temp" class="status-value">--°C</div>
            <div class="status-footer" onclick="toggleThermo()">
                <span>Consigne</span>
                <span id="txt-target">--°C</span>
            </div>
        </div>

        <!-- Windows -->
        <div id="window-card" class="glass-card status-card">
            <div class="status-header">
                <span>Fenêtres</span>
                <i class="fas fa-window-maximize"></i>
            </div>
            <div id="window-state" class="status-value">Fermées</div>
        </div>

        <!-- Robot -->
        <div class="glass-card status-card" onclick="launchEve()" style="cursor: pointer;">
            <div class="status-header">
                <span>Robot Aspirateur</span>
                <i class="fas fa-robot"></i>
            </div>
            <div class="status-value" style="font-size: 1.2rem;">Lancer Nettoyage</div>
        </div>
    </div>

    <!-- Bottom Controls -->
    <div class="bottom-controls glass-card">
        <button id="btn-edit" class="btn-action btn-edit" onclick="toggleEdit()">
            <i class="fas fa-edit"></i> Modifier
        </button>
        <button id="btn-save" class="btn-action btn-save" onclick="saveToJSON()" style="display: none;">
            <i class="fas fa-save"></i> Enregistrer
        </button>
    </div>

    <!-- Thermostat Panel -->
    <div id="thermo-overlay" onclick="if(event.target === this) toggleThermo()">
        <div class="thermo-panel glass-card">
            <h3 style="margin-bottom: 20px;">Réglage Consigne</h3>
            <div style="display: flex; align-items: center; justify-content: center; gap: 20px;">
                <button class="thermo-btn" onclick="adjustTemp(-0.5)">-</button>
                <div id="set-val" class="thermo-val">20.0</div>
                <button class="thermo-btn" onclick="adjustTemp(0.5)">+</button>
            </div>
            <div style="margin-top: 30px; display: flex; gap: 10px;">
                <button class="btn btn-secondary w-100" style="border-radius: 12px; padding: 12px;" onclick="toggleThermo()">Annuler</button>
                <button class="btn btn-primary w-100" style="border-radius: 12px; padding: 12px;" onclick="setThermostat()">Valider</button>
            </div>
        </div>
    </div>

    <!-- HA Modal -->
    <div id="modal-overlay" onclick="closeModal()"></div>
    <div id="ha-modal" class="glass-card">
        <iframe id="ha-frame" src="" style="width:100%; height:100%; border:none;"></iframe>
    </div>

    <!-- Config Modal -->
    <div class="modal fade" id="configModal" tabindex="-1" style="color: black; z-index: 5000;">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-card" style="background: white;">
                <div class="modal-header">
                    <h5 class="modal-title">Configuration Hotspot</h5>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="edit-idx">
                    <div class="mb-3">
                        <label class="form-label">Nom / Tooltip</label>
                        <input type="text" id="node-name" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Entité HA ou URL</label>
                        <input type="text" id="node-url" class="form-control">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger me-auto" onclick="deleteHotspot()">Supprimer</button>
                    <button type="button" class="btn btn-primary" onclick="confirmHotspot()">Enregistrer</button>
                </div>
            </div>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

<script>
let HA_URL, TOKEN, WEATHER_ENTITY, ROOMS = [];
let curR = 0, hotspots = [], editMode = false, headers = {};
let panoViewer = null;
const bModal = new bootstrap.Modal(document.getElementById('configModal'));

async function loadGlobalConfig() {
    try {
        const res = await fetch('config.json?t=' + Date.now());
        const config = await res.json();
        HA_URL = config.ha_url;
        TOKEN = config.ha_token;
        WEATHER_ENTITY = config.weather_entity;
        ROOMS = config.rooms;
        headers = { "Authorization": `Bearer ${TOKEN}`, "Content-Type": "application/json" };
        return true;
    } catch(e) { return false; }
}

async function callHA(domain, service, data) {
    try {
        await fetch(`${HA_URL}/api/services/${domain}/${service}`, {
            method: 'POST', headers, body: JSON.stringify(data)
        });
    } catch(e) { console.error(e); }
}

async function getEntityState(entity_id) {
    if (!entity_id) return null;
    try {
        const res = await fetch(`${HA_URL}/api/states/${entity_id}`, { headers });
        return res.ok ? await res.json() : null;
    } catch (e) { return null; }
}

function updateClock() {
    const now = new Date();
    document.getElementById('clock').innerText = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    const hour = now.getHours();
    let g = "Bonjour";
    if (hour >= 18) g = "Bonsoir";
    if (hour >= 23 || hour < 5) g = "Bonne nuit";
    document.getElementById('greeting').innerText = g;
}

async function updateStatus() {
    updateClock();
    const r = ROOMS[curR];

    // Weather
    const w = await getEntityState(WEATHER_ENTITY);
    if(w) {
        document.getElementById('weather-temp').innerText = `${w.attributes.temperature}°C`;
        const icons = { sunny:'☀️', cloudy:'☁️', partlycloudy:'⛅', rainy:'🌧️', 'clear-night':'🌙' };
        document.getElementById('weather-icon').innerText = icons[w.state] || '🌡️';
    }

    // Temperature
    const t = await getEntityState(r.temp);
    if(t) document.getElementById('txt-temp').innerText = `${parseFloat(t.state).toFixed(1)}°C`;

    // Climate
    const c = await getEntityState(r.climate);
    if(c) {
        const target = c.attributes.temperature || "--";
        document.getElementById('txt-target').innerText = `${target}°C`;
        document.getElementById('set-val').innerText = parseFloat(target).toFixed(1);
    }

    // Window
    if(r.window_entity) {
        const ws = await getEntityState(r.window_entity);
        const el = document.getElementById('window-state');
        const card = document.getElementById('window-card');
        if(ws && (ws.state === 'on' || ws.state === 'open')) {
            el.innerText = "Ouverte ⚠️";
            card.style.background = "rgba(239, 68, 68, 0.2)";
        } else {
            el.innerText = "Fermées";
            card.style.background = "var(--glass)";
        }
    }
}

async function switchRoom(idx) {
    curR = idx;
    document.querySelectorAll('.btn-room').forEach((b, i) => b.classList.toggle('active', i === idx));

    const r = ROOMS[curR];
    const timestamp = Date.now();

    // Reset data
    hotspots = [];
    
    // Load Hotspots
    try {
        const res = await fetch(`${r.config_360}?t=${timestamp}`);
        if(res.ok) hotspots = await res.json();
    } catch(e) {}

    initPannellum();
    updateStatus();
}

function initPannellum() {
    if(panoViewer) panoViewer.destroy();
    const r = ROOMS[curR];

    panoViewer = pannellum.viewer('panorama', {
        "type": "equirectangular",
        "panorama": r.img360,
        "autoLoad": true,
        "hotSpots": hotspots.map((h, i) => ({
            pitch: h.pi ?? h.pitch ?? 0,
            yaw: h.y ?? h.yaw ?? 0,
            cssClass: 'custom-hotspot',
            createTooltipFunc: (el) => {
                const tooltip = document.createElement('div');
                tooltip.style.cssText = "background: rgba(0,0,0,0.8); color: white; padding: 5px 12px; border-radius: 20px; font-size: 13px; transform: translateY(-40px);";
                tooltip.innerText = h.n;
                el.appendChild(tooltip);
            },
            clickHandlerFunc: () => editMode ? openConfig(i) : handleAction(h)
        }))
    });

    let startX, startY;
    panoViewer.on('mousedown', e => { startX = e.clientX; startY = e.clientY; });
    panoViewer.on('mouseup', e => {
        if(!editMode) return;
        const dist = Math.sqrt(Math.pow(e.clientX - startX, 2) + Math.pow(e.clientY - startY, 2));
        if (dist < 5) {
            const c = panoViewer.mouseEventToCoords(e);
            hotspots.push({ n: "Nouveau", pi: c[0], y: c[1], u: "" });
            initPannellum();
            openConfig(hotspots.length - 1);
        }
    });
}

async function handleAction(h) {
    const url = h.u || h.url;
    if(!url) return;
    if(url.includes('.') && !url.includes('/')) {
        await callHA('homeassistant', 'toggle', { entity_id: url });
    } else {
        document.getElementById('ha-frame').src = url;
        document.getElementById('ha-modal').style.display = 'block';
        document.getElementById('modal-overlay').style.display = 'block';
    }
}

function toggleEdit() {
    editMode = !editMode;
    const btn = document.getElementById('btn-edit');
    btn.classList.toggle('active', editMode);
    btn.innerHTML = editMode ? '<i class="fas fa-times"></i> Quitter' : '<i class="fas fa-edit"></i> Modifier';
    document.getElementById('btn-save').style.display = editMode ? 'block' : 'none';
}

function openConfig(idx) {
    document.getElementById('edit-idx').value = idx;
    const h = hotspots[idx];
    document.getElementById('node-name').value = h.n;
    document.getElementById('node-url').value = h.u || h.url || "";
    bModal.show();
}

function confirmHotspot() {
    const i = parseInt(document.getElementById('edit-idx').value);
    if (!isNaN(i)) {
        hotspots[i].n = document.getElementById('node-name').value;
        hotspots[i].u = document.getElementById('node-url').value;
    }
    bModal.hide();
    initPannellum();
}

function deleteHotspot() {
    const i = parseInt(document.getElementById('edit-idx').value);
    if (!isNaN(i)) {
        hotspots.splice(i, 1);
    }
    bModal.hide();
    initPannellum();
}

async function saveToJSON() {
    const r = ROOMS[curR];
    try {
        const res = await fetch('save_hotspots.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ file: r.config_360, content: hotspots })
        });
        const data = await res.json();
        if(data.success) {
            alert("✅ Configuration sauvegardée !");
            toggleEdit();
        } else throw new Error(data.error);
    } catch(e) { alert("❌ Erreur: " + e.message); }
}

function toggleThermo() {
    const el = document.getElementById('thermo-overlay');
    el.style.display = (el.style.display === 'flex') ? 'none' : 'flex';
}

function adjustTemp(v) {
    const el = document.getElementById('set-val');
    let c = parseFloat(el.innerText);
    el.innerText = Math.max(5, Math.min(30, c + v)).toFixed(1);
}

async function setThermostat() {
    const r = ROOMS[curR];
    const val = parseFloat(document.getElementById('set-val').innerText);
    await callHA("climate", "set_temperature", { entity_id: r.climate, temperature: val });
    toggleThermo();
    setTimeout(updateStatus, 1000);
}

async function launchEve() {
    await callHA("button", "press", { entity_id: ROOMS[curR].vacuum_entity });
    alert("🤖 EVE est en route !");
}

function closeModal() {
    document.getElementById('ha-modal').style.display = 'none';
    document.getElementById('modal-overlay').style.display = 'none';
    document.getElementById('ha-frame').src = '';
}

// Init
(async () => {
    if(await loadGlobalConfig()) {
        const sidebar = document.getElementById('room-sidebar');
        sidebar.innerHTML = ROOMS.map((r, i) => `
            <div class="btn-room" onclick="switchRoom(${i})">
                <span style="font-size: 1.2rem;">${r.icon}</span>
                <span>${r.n}</span>
            </div>
        `).join('');

        switchRoom(0);
        setInterval(updateStatus, 30000);
    } else {
        alert("Erreur critique: config.json manquant.");
    }
})();
</script>
</body>
</html>
