<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Studio Domotique 360 PRO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            font-family: 'Inter', sans-serif;
            color: white;
            overflow: hidden;
            position: relative;
            height: 100vh;
            transition: background 0.3s ease;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(255, 119, 198, 0.08) 0%, transparent 50%);
            animation: gradientShift 15s ease infinite;
            pointer-events: none;
        }
        @keyframes gradientShift {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.1); }
        }
        #plan-wrapper {
            position: relative; display: flex; justify-content: center; align-items: center;
            height: 100vh; width: 100vw; padding: 120px 320px 120px 260px;
            touch-action: pan-y;
        }
        #plan-container {
            position: relative; display: flex; justify-content: center; align-items: center;
            animation: fadeInScale 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            width: 100%; height: 100%; max-width: 100%; max-height: 100%;
        }
        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        #plan-img {
            max-height: 100%; max-width: 100%; width: auto; height: auto; object-fit: contain;
            border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 100px rgba(120, 119, 198, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1); transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #plan-img.fading { opacity: 0; transform: scale(0.92) translateY(20px); filter: blur(15px); }
        #panorama {
            width: 100%; height: 100%; border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.1);
            display: none; position: absolute; top: 0; left: 0;
        }
        #panorama.active { display: block; }
        #plan-img.hidden { display: none; }
        svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; border-radius: 24px; }
        .zone-poly { fill: #7877c6; fill-opacity: 0; cursor: pointer; pointer-events: all; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .zone-poly:hover { fill-opacity: 0.2; stroke: rgba(255, 255, 255, 0.6); stroke-width: 2; filter: drop-shadow(0 0 20px rgba(120, 119, 198, 0.5)); }
        .custom-hotspot {
            height: 30px; width: 30px; background: rgba(102, 126, 234, 0.8); border: 3px solid white;
            border-radius: 50%; cursor: pointer; box-shadow: 0 0 20px rgba(102, 126, 234, 0.6);
        }
        .custom-hotspot::after {
            content: ''; position: absolute; top: -3px; left: -3px; right: -3px; bottom: -3px;
            border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.5);
            animation: pulse-hotspot 2s ease-in-out infinite; pointer-events: none;
        }
        @keyframes pulse-hotspot {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        /* Info Overlay (non-cliquable) */
        .info-overlay {
            position: absolute;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: white;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); transition: all 0.3s ease;
        }
        .glass-header {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1100;
            width: calc(100% - 300px); display: flex; justify-content: space-between; align-items: center; padding: 15px 30px;
        }
        .header-left { display: flex; flex-direction: column; }
        .welcome-text {
            font-size: 1.25rem; font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.7) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .date-text { font-size: 0.75rem; color: rgba(255, 255, 255, 0.5); text-transform: uppercase; letter-spacing: 1px; }
        .header-center { text-align: center; }
        .clock-text { font-size: 1.5rem; font-weight: 800; letter-spacing: 2px; }
        .header-right { display: flex; align-items: center; gap: 15px; }
        .weather-info {
            display: flex; align-items: center; gap: 10px; background: rgba(255, 255, 255, 0.05);
            padding: 8px 15px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .weather-icon { font-size: 1.25rem; }
        .weather-temp { font-weight: 600; }

        /* Bouton Réglages */
        .btn-settings {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 15px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
        }
        .btn-settings:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .room-selector { position: fixed; top: 100px; left: 30px; z-index: 1000; max-width: 200px; }
        .room-header { padding: 20px; text-align: center; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .room-title {
            font-size: 0.75rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
            color: rgba(255, 255, 255, 0.5); margin-bottom: 8px;
        }
        .room-count {
            font-size: 1.5rem; font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .room-list { padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .btn-room {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7); padding: 12px 20px; border-radius: 12px;
            font-size: 0.875rem; font-weight: 500; text-align: left; transition: all 0.3s ease;
            position: relative; overflow: hidden; display: flex; justify-content: space-between; align-items: center;
        }
        .btn-room:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.3); color: white; transform: translateX(5px); }
        .btn-room.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: rgba(255, 255, 255, 0.3); color: white; box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-edit-room {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            cursor: pointer;
            margin-left: 10px;
        }
        .btn-edit-room:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .btn-add-room {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            border: none; color: white; padding: 10px; border-radius: 12px;
            font-size: 0.8rem; font-weight: 600; cursor: pointer;
            margin-top: 10px;
        }

        #status-panel {
            position: fixed; top: 100px; right: 30px; z-index: 1000; min-width: 280px;
            display: flex; flex-direction: column; gap: 15px;
        }

        .temp-card { padding: 20px; }
        .temp-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .temp-icon {
            width: 45px; height: 45px; background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem; box-shadow: 0 4px 15px rgba(245, 87, 108, 0.3);
        }
        .temp-info { flex: 1; }
        .temp-label {
            font-size: 0.7rem; color: rgba(255, 255, 255, 0.5); font-weight: 500;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .temp-value {
            font-size: 2rem; font-weight: 700;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            line-height: 1; margin-top: 5px;
        }
        .temp-target {
            display: flex; align-items: center; justify-content: space-between; padding: 12px;
            background: rgba(255, 255, 255, 0.05); border-radius: 10px; margin-top: 10px;
            cursor: pointer; transition: all 0.3s ease;
        }
        .btn-config-entity {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.7rem;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn-config-entity:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .window-card { padding: 15px; }
        .window-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .window-item:last-child {
            border-bottom: none;
        }
        .window-status { display: flex; align-items: center; gap: 10px; }
        .window-icon {
            width: 35px; height: 35px; border-radius: 10px; display: flex; align-items: center;
            justify-content: center; font-size: 1.1rem; transition: all 0.3s ease;
        }
        .window-closed .window-icon {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.3);
        }
        .window-open .window-icon {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            box-shadow: 0 4px 15px rgba(250, 112, 154, 0.3);
        }
        .window-text { flex: 1; }
        .window-label {
            font-size: 0.7rem; color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase; letter-spacing: 1px;
        }
        .window-state { font-size: 0.9rem; font-weight: 600; margin-top: 2px; }

        .eve-card {
            padding: 20px; cursor: pointer; transition: all 0.3s ease;
            position: relative; overflow: hidden;
        }
        .eve-content { display: flex; align-items: center; gap: 15px; position: relative; z-index: 1; }
        .eve-icon {
            width: 50px; height: 50px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px; display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        #thermo-panel {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9);
            opacity: 0; pointer-events: none; z-index: 2000;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); max-width: 400px; width: 90%;
        }
        #thermo-panel.active { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: all; }
        .thermo-backdrop {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px);
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 1999;
        }
        .thermo-backdrop.active { opacity: 1; pointer-events: all; }
        .thermo-content { padding: 30px; }
        .thermo-display {
            font-size: 4rem; font-weight: 700; text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .edit-controls {
            position: fixed; bottom: 30px; right: 30px; z-index: 1000;
            display: flex; flex-direction: column; gap: 10px; align-items: flex-end;
        }
        .btn-edit {
            padding: 12px 24px; border: none; border-radius: 12px; font-weight: 600;
            font-size: 0.875rem; cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        .btn-edit.primary { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; }
        .btn-edit.success { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color: white; }
        .btn-edit.view360 { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-edit.info { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); color: white; }
        #draw-line { stroke: #ff4444; stroke-width: 2; fill: rgba(255, 68, 68, 0.2); stroke-dasharray: 5; pointer-events: none; }

        .entity-list {
            max-height: 300px;
            overflow-y: auto;
        }
        .entity-item {
            padding: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            color: white;
        }
        .entity-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Fix Modals Visibility */
        .modal-content {
            background: rgba(15, 12, 41, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }
        .modal-header, .modal-footer {
            border-color: rgba(255, 255, 255, 0.1);
        }
        .modal-title {
            color: white;
        }
        .form-label {
            color: rgba(255, 255, 255, 0.8);
        }
        .form-control, .form-select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }
        .form-control:focus, .form-select:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.4);
            color: white;
            box-shadow: none;
        }
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        .btn-close {
            filter: invert(1) grayscale(100%) brightness(200%);
        }
        .text-muted {
            color: rgba(255, 255, 255, 0.5) !important;
        }
        hr {
            border-color: rgba(255, 255, 255, 0.2);
            opacity: 1;
        }

        @media (max-width: 768px) {
            #plan-wrapper { padding: 80px 10px 180px 10px; }
            .glass-header { width: 95%; top: 10px; padding: 8px 15px; }
            .clock-text { font-size: 1.2rem; }
            .welcome-text { font-size: 1rem; }
            .room-selector { display: none; }
            .room-selector.open { display: block; left: 10px; top: 70px; width: calc(100% - 20px); z-index: 2000; }
            .menu-toggle { display: flex; position: fixed; top: 15px; left: 15px; z-index: 2100; color: white; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 10px; }
            #status-panel {
                position: fixed; top: auto; bottom: 0; left: 0; right: 0; width: 100%;
                flex-direction: row; gap: 8px; padding: 10px; background: rgba(15, 12, 41, 0.95);
                backdrop-filter: blur(20px); border-top: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 20px 20px 0 0; overflow-x: auto; z-index: 900; min-width: auto;
                justify-content: flex-start;
            }
            #status-panel .glass-card { min-width: 160px; padding: 12px; flex-shrink: 0; }
            .temp-value { font-size: 1.5rem; }
            .temp-icon { width: 35px; height: 35px; font-size: 1rem; }
            .temp-header { margin-bottom: 5px; }
            .temp-target { padding: 8px; margin-top: 5px; font-size: 0.8rem; }
            .edit-controls { bottom: 110px; right: 15px; flex-direction: row; gap: 5px; }
            .btn-edit { padding: 8px 15px; font-size: 0.75rem; border-radius: 30px; }
        }
    </style>
</head>
<body>

<div class="menu-toggle" onclick="toggleMobileMenu()"><i class="fas fa-bars"></i></div>
<div class="mobile-overlay" onclick="toggleMobileMenu()"></div>

<div class="glass-header glass-card">
    <div class="header-left">
        <div id="greeting" class="welcome-text">Bonjour</div>
        <div id="date-now" class="date-text">-- --- ----</div>
    </div>
    <div class="header-center"><div id="clock" class="clock-text">00:00</div></div>
    <div class="header-right">
        <div class="weather-info">
            <span id="weather-icon" class="weather-icon">☁️</span>
            <span id="weather-temp" class="weather-temp">--°C</span>
        </div>
        <button class="btn-settings" onclick="openSettings()">
            <i class="fas fa-cog"></i>
            <span>Réglages</span>
        </button>
    </div>
</div>

<div class="room-selector glass-card">
    <div class="room-header">
        <div class="room-title">Ma Maison</div>
        <div id="room-count" class="room-count">5 Pièces</div>
    </div>
    <div id="room-list" class="room-list"></div>
    <button class="btn-add-room" onclick="openAddRoomModal()">
        <i class="fas fa-plus"></i> Ajouter une pièce
    </button>
</div>

<div id="plan-wrapper">
    <div id="plan-container">
        <img src="Cuisine.jpg" id="plan-img" alt="Plan">
        <div id="panorama"></div>
        <div id="info-overlays"></div>
        <svg id="svg-overlay" onclick="handleMapClick(event)">
            <polyline id="draw-line" points=""></polyline>
        </svg>
    </div>
</div>

<div id="status-panel">
    <div class="glass-card temp-card">
        <div class="temp-header">
            <div class="temp-info">
                <div class="temp-label">Température</div>
                <div id="txt-temp" class="temp-value">--°C</div>
            </div>
            <div class="temp-icon">🌡️</div>
        </div>
        <div class="temp-target" onclick="toggleThermo()">
            <span class="target-label">Consigne</span>
            <span id="txt-target" class="target-value">--°C</span>
        </div>
        <button class="btn-config-entity" onclick="openEntityConfig('temp')">
            <i class="fas fa-cog"></i> Config
        </button>
    </div>

    <div class="glass-card window-card">
        <div class="temp-label" style="margin-bottom: 10px;">Fenêtres & Volets</div>
        <div id="windows-container"></div>
        <button class="btn-config-entity" onclick="openEntityConfig('windows')">
            <i class="fas fa-plus"></i> Ajouter
        </button>
    </div>

    <div class="glass-card eve-card" onclick="launchEve()">
        <div class="eve-content">
            <div class="eve-icon">🤖</div>
            <div class="eve-text">
                <div class="eve-label">Robot</div>
                <div id="eve-title" class="eve-title">Lancer</div>
            </div>
        </div>
        <button class="btn-config-entity" onclick="event.stopPropagation(); openEntityConfig('vacuum')">
            <i class="fas fa-cog"></i> Config
        </button>
    </div>
</div>

<div class="thermo-backdrop" onclick="toggleThermo()"></div>
<div id="thermo-panel" class="glass-card">
    <div class="thermo-content">
        <div class="thermo-header">
            <div class="thermo-title">Réglage</div>
            <div id="thermo-subtitle" class="thermo-subtitle">Température Cible</div>
        </div>
        <div class="thermo-controls">
            <button class="thermo-btn minus" onclick="adjustTemp(-0.5)">-</button>
            <div id="set-val" class="thermo-display">20.0</div>
            <button class="thermo-btn plus" onclick="adjustTemp(0.5)">+</button>
        </div>
        <div class="thermo-actions">
            <button class="btn-thermo cancel" onclick="toggleThermo()">Annuler</button>
            <button class="btn-thermo confirm" onclick="setThermostat()">Valider</button>
        </div>
    </div>
</div>

<div class="edit-controls">
    <button id="btn-360" class="btn-edit view360" onclick="toggle360View()">
        <i class="fas fa-globe"></i> 360°
    </button>
    <button id="btn-info" class="btn-edit info" onclick="toggleInfoMode()">
        <i class="fas fa-info-circle"></i> Info
    </button>
    <button id="btn-edit" class="btn-edit primary" onclick="toggleEdit()">
        <i class="fas fa-pen"></i> Modifier
    </button>
    <button id="btn-save" class="btn-edit success" style="display: none;" onclick="saveToJSON()">
        <i class="fas fa-save"></i> Save
    </button>
</div>

<!-- Modal Réglages -->
<div class="modal fade" id="settingsModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-cog"></i> Réglages</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Couleur de fond</label>
                    <select id="bg-color-select" class="form-select">
                        <option value="default">Violet/Bleu (par défaut)</option>
                        <option value="dark">Noir</option>
                        <option value="blue">Bleu</option>
                        <option value="green">Vert</option>
                        <option value="red">Rouge</option>
                        <option value="orange">Orange</option>
                    </select>
                </div>
                <hr>
                <button class="btn btn-danger w-100" onclick="cleanupBase64Images()">
                    <i class="fas fa-broom"></i> Nettoyer attributs base64
                </button>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fermer</button>
                <button type="button" class="btn btn-primary" onclick="saveSettings()">Enregistrer</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal Config Entités -->
<div class="modal fade" id="entityConfigModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="entityConfigTitle">Configuration</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="entity-config-type">
                <input type="hidden" id="entity-config-idx">
                <div class="mb-3">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

<script>
let HA_URL = "", TOKEN = "", WEATHER_ENTITY = "weather.izon", STORAGE_ENTITY = "input_boolean.storage_plans_360";

let ROOMS = [];

let curR = 0, zones = [], hotspots = [], infoOverlays = [], currentPoints = [], editMode = false, infoMode = false, is360Active = false, panoViewer = null;
let allEntities = [];
let headers = { "Content-Type": "application/json" };
const bModal = new bootstrap.Modal(document.getElementById('configModal'));
const addRoomModal = new bootstrap.Modal(document.getElementById('addRoomModal'));
const settingsModal = new bootstrap.Modal(document.getElementById('settingsModal'));
const entityConfigModal = new bootstrap.Modal(document.getElementById('entityConfigModal'));
const infoOverlayModal = new bootstrap.Modal(document.getElementById('infoOverlayModal'));
let haModalInstance = null;

// ========== RÉGLAGES ==========

function openSettings() {
    const currentBg = localStorage.getItem('bgColor') || 'default';
    document.getElementById('bg-color-select').value = currentBg;
    settingsModal.show();
}

function saveSettings() {
    const bgColor = document.getElementById('bg-color-select').value;
    localStorage.setItem('bgColor', bgColor);
    applyBackgroundColor(bgColor);
    settingsModal.hide();
}

function applyBackgroundColor(color) {
    const backgrounds = {
        default: 'linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%)',
        dark: 'linear-gradient(135deg, #000000 0%, #1a1a1a 50%, #0a0a0a 100%)',
        blue: 'linear-gradient(135deg, #0c1445 0%, #1e3a8a 50%, #172554 100%)',
        green: 'linear-gradient(135deg, #064e3b 0%, #065f46 50%, #047857 100%)',
        red: 'linear-gradient(135deg, #450a0a 0%, #7f1d1d 50%, #991b1b 100%)',
        orange: 'linear-gradient(135deg, #431407 0%, #7c2d12 50%, #9a3412 100%)'
    };
    document.body.style.background = backgrounds[color] || backgrounds.default;
}

// Nettoyer les images base64 des attributs
async function cleanupBase64Images() {
    if (!confirm('Nettoyer les images base64 des attributs ?')) return;

    try {
        const res = await fetch(`${HA_URL}/api/states/${STORAGE_ENTITY}`, { headers });
        const data = await res.json();
        let attr = data.attributes || {};

        if (attr.rooms) {
            attr.rooms = attr.rooms.map(room => ({
                ...room,
                img: room.img && room.img.startsWith('data:') ? '' : room.img,
                img360: room.img360 && room.img360.startsWith('data:') ? '' : room.img360
            }));
        }

        await fetch(`${HA_URL}/api/states/${STORAGE_ENTITY}`, {
            method: 'POST', headers,
            body: JSON.stringify({ state: "on", attributes: attr })
        });

        alert('✅ Nettoyage terminé !');
        settingsModal.hide();
        location.reload();
    } catch(e) {
        alert('❌ Erreur: ' + e.message);
    }
}

// ========== GESTION ENTITÉS ==========

async function fetchAllEntities() {
    try {
        const res = await fetch(`${HA_URL}/api/states`, { headers });
        allEntities = await res.json();
        console.log(`📋 ${allEntities.length} entités chargées`);
    } catch(e) {
        console.error("Erreur chargement entités:", e);
    }
}

function openEntityConfig(type) {
    document.getElementById('entity-config-type').value = type;

    let title = '';
    let filter = '';
    let showDelete = false;

    switch(type) {
        case 'temp':
            title = 'Capteur de température';
            filter = 'sensor';
            break;
        case 'climate':
            title = 'Thermostat';
            filter = 'climate';
            break;
        case 'vacuum':
            title = 'Robot aspirateur';
            filter = 'button,vacuum';
            break;
        case 'windows':
            title = 'Fenêtre ou Volet';
            filter = 'binary_sensor,cover';
            showDelete = true;
            break;
    }

    document.getElementById('entityConfigTitle').innerText = title;
    document.getElementById('btn-delete-entity').style.display = showDelete ? 'block' : 'none';

    displayEntities(filter);
    entityConfigModal.show();
}

function displayEntities(filter) {
    const container = document.getElementById('entity-list-container');
    const filters = filter.split(',');

    const filtered = allEntities.filter(e => {
        return filters.some(f => e.entity_id.startsWith(f + '.'));
    });

    container.innerHTML = filtered.map(e =>
        `<div class="entity-item" onclick="selectEntity('${e.entity_id}')">
            <strong>${e.entity_id}</strong><br>
            <small>${e.attributes.friendly_name || ''}</small>
        </div>`
    ).join('');
}

function filterEntities() {
    const search = document.getElementById('entity-search').value.toLowerCase();
    const items = document.querySelectorAll('.entity-item');

    items.forEach(item => {
        const text = item.textContent.toLowerCase();
        item.style.display = text.includes(search) ? 'block' : 'none';
    });
}

function selectEntity(entityId) {
    const type = document.getElementById('entity-config-type').value;
    const room = ROOMS[curR];

    switch(type) {
        case 'temp':
            room.temp = entityId;
            break;
        case 'climate':
            room.climate = entityId;
            break;
        case 'vacuum':
            room.vacuum = entityId;
            break;
        case 'windows':
            if (!room.windows) room.windows = [];
            if (!room.windows.includes(entityId)) {
                room.windows.push(entityId);
            }
            break;
    }

    saveRooms();
    updateStatus();
    entityConfigModal.hide();
}

function deleteEntity() {
    // Pour les fenêtres uniquement
    const type = document.getElementById('entity-config-type').value;
    if (type !== 'windows') return;

    const idx = parseInt(document.getElementById('entity-config-idx').value);
    const room = ROOMS[curR];

    if (room.windows && idx >= 0 && idx < room.windows.length) {
        room.windows.splice(idx, 1);
        saveRooms();
        updateStatus();
        entityConfigModal.hide();
    }
}

// ========== INFO OVERLAYS (AFFICHAGE STATUT) ==========

function toggleInfoMode() {
    infoMode = !infoMode;
    document.getElementById('btn-info').innerHTML = infoMode ?
        '<i class="fas fa-times"></i> Quitter' :
        '<i class="fas fa-info-circle"></i> Info';

    if (!infoMode) {
        drawInfoOverlays();
    }
}

function handleInfoClick(e) {
    if (!infoMode) return;

    const img = document.getElementById('plan-img');
    const rect = img.getBoundingClientRect();
    const x = Math.round(((e.clientX - rect.left) / rect.width) * 100);
    const y = Math.round(((e.clientY - rect.top) / rect.height) * 100);

    infoOverlays.push({
        x: x,
        y: y,
        entity: '',
        template: '{state}'
    });

    openInfoOverlayConfig(infoOverlays.length - 1);
}

function openInfoOverlayConfig(idx) {
    document.getElementById('info-idx').value = idx;
    const info = infoOverlays[idx];
    document.getElementById('info-entity').value = info.entity || '';
    document.getElementById('info-template').value = info.template || '{state}';
    infoOverlayModal.show();
}

function confirmInfoOverlay() {
    const idx = parseInt(document.getElementById('info-idx').value);
    const info = infoOverlays[idx];
    info.entity = document.getElementById('info-entity').value;
    info.template = document.getElementById('info-template').value;
    infoOverlayModal.hide();
    drawInfoOverlays();
    saveToJSON(true);
}

function deleteInfoOverlay() {
    const idx = parseInt(document.getElementById('info-idx').value);
    infoOverlays.splice(idx, 1);
    infoOverlayModal.hide();
    drawInfoOverlays();
    saveToJSON(true);
}

async function drawInfoOverlays() {
    const container = document.getElementById('info-overlays');
    container.innerHTML = '';

    if (is360Active) return;

    const img = document.getElementById('plan-img');
    const rect = img.getBoundingClientRect();

    for (const [i, info] of infoOverlays.entries()) {
        if (!info.entity) continue;

        const state = await getEntityState(info.entity);
        if (!state) continue;

        let text = info.template
            .replace('{state}', state.state)
            .replace('{name}', state.attributes.friendly_name || '');

        // Remplacement dynamique des attributs
        const attrMatches = text.match(/\{attributes\.([^}]+)\}/g);
        if (attrMatches) {
            attrMatches.forEach(match => {
                const attrName = match.replace('{attributes.', '').replace('}', '');
                const attrValue = state.attributes[attrName] !== undefined ? state.attributes[attrName] : '';
                text = text.replace(match, attrValue);
            });
        }

        // Support legacy {remaining}
        if (state.attributes.remaining) {
            text = text.replace('{remaining}', state.attributes.remaining);
        }

        const div = document.createElement('div');
        div.className = 'info-overlay';
        div.style.left = `${img.offsetLeft + (info.x * rect.width) / 100}px`;
        div.style.top = `${img.offsetTop + (info.y * rect.height) / 100}px`;
        div.innerText = text;

        if (infoMode) {
            div.style.pointerEvents = 'all';
            div.style.cursor = 'pointer';
            div.onclick = () => openInfoOverlayConfig(i);
        }

        container.appendChild(div);
    }
}

// ========== GESTION PIÈCES ==========

async function loadRooms() {
    try {
        const res = await fetch(`${HA_URL}/api/states/${STORAGE_ENTITY}`, { headers });
        const data = await res.json();
        if (data.attributes && data.attributes.rooms) {
            ROOMS = data.attributes.rooms;
        }
    } catch(e) {}
}

async function saveRooms() {
    try {
        const res = await fetch(`${HA_URL}/api/states/${STORAGE_ENTITY}`, { headers });
        const data = await res.json();
        let attr = data.attributes || {};
        attr.rooms = ROOMS;
        await fetch(`${HA_URL}/api/states/${STORAGE_ENTITY}`, {
            method: 'POST', headers,
            body: JSON.stringify({ state: "on", attributes: attr })
        });
    } catch(e) {}
}

function openAddRoomModal() {
    document.getElementById('edit-room-idx').value = '-1';
    document.getElementById('addRoomModalTitle').innerText = 'Ajouter une pièce';
    document.getElementById('new-room-name').value = '';
    document.getElementById('new-room-icon').value = '';
    document.getElementById('new-room-img').value = '';
    document.getElementById('new-room-img360').value = '';
    document.getElementById('current-img-info').innerText = '';
    document.getElementById('current-img360-info').innerText = '';
    document.getElementById('btn-delete-room').style.display = 'none';
    addRoomModal.show();
}

function openEditRoomModal(idx) {
    const room = ROOMS[idx];
    document.getElementById('edit-room-idx').value = idx;
    document.getElementById('addRoomModalTitle').innerText = 'Modifier la pièce';
    document.getElementById('new-room-name').value = room.n;
    document.getElementById('new-room-icon').value = room.icon;
    document.getElementById('new-room-img').value = '';
    document.getElementById('new-room-img360').value = '';
    document.getElementById('current-img-info').innerText = room.img ? '✅ Image actuelle présente' : '❌ Aucune image';
    document.getElementById('current-img360-info').innerText = room.img360 ? '✅ Image 360° actuelle présente' : '❌ Aucune image 360°';
    document.getElementById('btn-delete-room').style.display = 'block';
    addRoomModal.show();
}

async function saveRoom() {
    const idx = parseInt(document.getElementById('edit-room-idx').value);
    const name = document.getElementById('new-room-name').value.trim();
    const icon = document.getElementById('new-room-icon').value.trim() || '🏠';
    const imgFile = document.getElementById('new-room-img').files[0];
    const img360File = document.getElementById('new-room-img360').files[0];

    if (!name) {
        alert('Nom requis');
        return;
    }

    let img = '';
    let img360 = '';

    if (idx >= 0) {
        img = ROOMS[idx].img || '';
        img360 = ROOMS[idx].img360 || '';
    }

    if (imgFile) {
        const uploadedName = await uploadImageToServer(imgFile, name, false);
        if (uploadedName) img = uploadedName;
    }
    if (img360File) {
        const uploadedName = await uploadImageToServer(img360File, name, true);
        if (uploadedName) img360 = uploadedName;
    }

    if (idx >= 0) {
        ROOMS[idx].n = name;
        ROOMS[idx].icon = icon;
        ROOMS[idx].img = img;
        ROOMS[idx].img360 = img360;
    } else {
        ROOMS.push({
            n: name,
            icon: icon,
            img: img,
            img360: img360,
            temp: '',
            climate: '',
            vacuum: '',
            windows: []
        });
    }

    await saveRooms();
    initRoomSelector();

    if (idx === curR) {
        document.getElementById('plan-img').src = img;
        syncSVG();
    }

    addRoomModal.hide();
    alert(idx >= 0 ? 'Pièce modifiée !' : 'Pièce ajoutée !');
}

async function deleteRoom() {
    const idx = parseInt(document.getElementById('edit-room-idx').value);

    if (idx < 0 || idx >= ROOMS.length) return;

    if (!confirm(`Supprimer "${ROOMS[idx].n}" ?`)) return;

    ROOMS.splice(idx, 1);

    await saveRooms();
    initRoomSelector();

    if (idx === curR) {
        curR = 0;
        await switchRoom(0);
    } else if (idx < curR) {
        curR--;
    }

    addRoomModal.hide();
    alert('Pièce supprimée !');
}

async function uploadImageToServer(file, roomName, is360) {
    try {
        const cleanName = roomName.replace(/[^a-zA-Z0-9]/g, '_');
        const extension = file.name.split('.').pop();
        const fileName = is360 ? `${cleanName}__1.${extension}` : `${cleanName}.${extension}`;

        console.log(`📤 Image à uploader: ${fileName}`);
        console.log(`⚠️ MANUEL: Copie cette image dans /config/www/home/${fileName}`);

        // Télécharger l'image
        const url = URL.createObjectURL(file);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        return fileName;

    } catch(e) {
        console.error("Erreur upload:", e);
        return null;
    }
}

// ========== SWIPE ==========

let touchStartX = 0;
let touchEndX = 0;

const wrapper = document.getElementById('plan-wrapper');
wrapper.addEventListener('touchstart', e => {
    if (is360Active) return;
    touchStartX = e.changedTouches[0].screenX;
}, false);

wrapper.addEventListener('touchend', e => {
    if (is360Active) return;
    touchEndX = e.changedTouches[0].screenX;
    const threshold = 80;
    if (touchEndX < touchStartX - threshold) {
        let next = (curR + 1 >= ROOMS.length) ? 0 : curR + 1;
        switchRoom(next);
    }
    if (touchEndX > touchStartX + threshold) {
        let prev = (curR - 1 < 0) ? ROOMS.length - 1 : curR - 1;
        switchRoom(prev);
    }
}, false);

// ========== LOGIQUE APP ==========

async function loadFromJSON() {
    const r = ROOMS[curR];
    const roomKey = r.n.toLowerCase();
    try {
        const res = await fetch(`${HA_URL}/api/states/${STORAGE_ENTITY}`, { headers });
        const data = await res.json();
        const attr = data.attributes || {};

        zones = attr[roomKey + '_zones'] || [];
        hotspots = attr[roomKey + '_hotspots'] || [];
        infoOverlays = attr[roomKey + '_info'] || [];

    } catch(e) {
        zones = [];
        hotspots = [];
        infoOverlays = [];
    }
}

async function saveToJSON(silent = false) {
    const r = ROOMS[curR];
    const roomKey = r.n.toLowerCase();
    try {
        const resCurrent = await fetch(`${HA_URL}/api/states/${STORAGE_ENTITY}`, { headers });
        const currentData = await resCurrent.json();
        let attr = currentData.attributes || {};

        attr[roomKey + '_zones'] = zones;
        attr[roomKey + '_hotspots'] = hotspots;
        attr[roomKey + '_info'] = infoOverlays;

        await fetch(`${HA_URL}/api/states/${STORAGE_ENTITY}`, {
            method: 'POST', headers,
            body: JSON.stringify({ state: "on", attributes: attr })
        });

        if (!silent) {
            alert("✅ Sauvegardé !");
            toggleEdit();
        }
    } catch(e) {
        alert("❌ Erreur");
    }
}

async function callHA(domain, service, data) {
    try {
        await fetch(`${HA_URL}/api/services/${domain}/${service}`, {
            method: 'POST', 
            headers, 
            body: JSON.stringify(data)
        });
    } catch(e) {}
}

async function getEntityState(entity_id) {
    if (!entity_id) return null;
    try {
        const res = await fetch(`${HA_URL}/api/states/${entity_id}`, { headers });
        return res.ok ? await res.json() : null;
    } catch (e) { return null; }
}

function updateHeader() {
    const now = new Date();
    document.getElementById('clock').innerText = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    document.getElementById('date-now').innerText = now.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
    const hour = now.getHours();
    document.getElementById('greeting').innerText = hour >= 22 || hour < 5 ? "Douce nuit" : hour >= 18 ? "Bonsoir" : "Bonjour";
}

async function fetchWeather() {
    const state = await getEntityState(WEATHER_ENTITY);
    if (!state) return;
    document.getElementById('weather-temp').innerText = `${Math.round(state.attributes.temperature)}°C`;
    const icons = {
        'clear-night': '🌙', 'cloudy': '☁️', 'fog': '🌫️', 'sunny': '☀️',
        'rainy': '🌦️', 'snowy': '❄️', 'partlycloudy': '⛅'
    };
    document.getElementById('weather-icon').innerText = icons[state.state] || '🌡️';
}

function initRoomSelector() {
    document.getElementById('room-list').innerHTML = ROOMS.map((r, i) =>
        `<button class="btn-room ${i === curR ? 'active' : ''}" onclick="switchRoom(${i})">
            <span>${r.icon} ${r.n}</span>
            <span class="btn-edit-room" onclick="event.stopPropagation(); openEditRoomModal(${i})">
                <i class="fas fa-edit"></i>
            </span>
        </button>`
    ).join('');
    document.getElementById('room-count').innerText = `${ROOMS.length} Pièces`;
}

async function updateStatus() {
    const r = ROOMS[curR];

    // Température
    const tState = await getEntityState(r.temp);
    if(tState) document.getElementById('txt-temp').innerText = `${parseFloat(tState.state).toFixed(1)}°C`;

    // Thermostat
    const cState = await getEntityState(r.climate);
    if(cState) {
        const target = cState.attributes.temperature || "--";
        document.getElementById('txt-target').innerText = `${target}°C`;
        document.getElementById('set-val').innerText = parseFloat(target).toFixed(1);
    }

    // Fenêtres & Volets
    const windowsContainer = document.getElementById('windows-container');
    windowsContainer.innerHTML = '';

    if (r.windows && r.windows.length > 0) {
        for (const [idx, windowEntity] of r.windows.entries()) {
            const wState = await getEntityState(windowEntity);
            if (!wState) continue;

            const isOpen = wState.state === 'on' || wState.state === 'open';
            const name = wState.attributes.friendly_name || windowEntity;
            const isCover = windowEntity.startsWith('cover.');

            const html = `
                <div class="window-item">
                    <div class="window-status ${isOpen ? 'window-open' : 'window-closed'}">
                        <div class="window-icon">${isCover ? '🪟' : '🪟'}</div>
                        <div class="window-text">
                            <div class="window-label">${name}</div>
                            <div class="window-state">${isOpen ? (isCover ? 'Ouvert' : 'Ouverte') : (isCover ? 'Fermé' : 'Fermée')}</div>
                        </div>
                    </div>
                </div>
            `;
            windowsContainer.innerHTML += html;
        }
    } else {
        windowsContainer.innerHTML = '<small style="color: rgba(255,255,255,0.5);">Aucune fenêtre configurée</small>';
    }

    drawInfoOverlays();
}

async function switchRoom(idx) {
    curR = idx;
    const r = ROOMS[curR];
    document.querySelectorAll('.btn-room').forEach((b, i) => i === idx ? b.classList.add('active') : b.classList.remove('active'));
    
    document.getElementById('btn-360').style.display = r.img360 ? 'block' : 'none';
    if(is360Active) toggle360View();

    const img = document.getElementById('plan-img');
    
    await loadFromJSON();

    img.classList.add('fading');

    setTimeout(async () => {
        img.src = r.img || 'Cuisine.jpg';

        await updateStatus();

        img.onload = () => {
            img.classList.remove('fading');
            setTimeout(() => {
                syncSVG();
                drawInfoOverlays();
            }, 100);
        };

        if (img.complete) {
            img.classList.remove('fading');
            syncSVG();
            drawInfoOverlays();
        }
    }, 400);
}

function toggle360View() {
    const r = ROOMS[curR];
    is360Active = !is360Active;
    const img = document.getElementById('plan-img');
    const pano = document.getElementById('panorama');
    const svg = document.getElementById('svg-overlay');
    const btn = document.getElementById('btn-360');
    const infoContainer = document.getElementById('info-overlays');
    const statusPanel = document.getElementById('status-panel');
    
    if(is360Active) {
        img.classList.add('hidden');
        svg.style.display = 'none';
        infoContainer.style.display = 'none';
        statusPanel.style.display = 'none';
        pano.classList.add('active');
        btn.innerHTML = '<i class="fas fa-map"></i> Plan 2D';
        initPannellum();
    } else {
        img.classList.remove('hidden');
        svg.style.display = 'block';
        infoContainer.style.display = 'block';
        statusPanel.style.display = 'flex';
        pano.classList.remove('active');
        btn.innerHTML = '<i class="fas fa-globe"></i> Vue 360°';
        if(panoViewer) panoViewer.destroy();
        drawZones();
        drawInfoOverlays();
    }
}

function initPannellum() {
    if(panoViewer) panoViewer.destroy();
    panoViewer = pannellum.viewer('panorama', {
        "type": "equirectangular",
        "panorama": ROOMS[curR].img360,
        "autoLoad": true,
        "showControls": false,
        "hotSpots": hotspots.map((h, i) => ({
            pitch: parseFloat(h.pitch ?? 0),
            yaw: parseFloat(h.yaw ?? 0),
            cssClass: 'custom-hotspot',
            clickHandlerFunc: () => editMode ? openConfig(i, '360') : handleAction(h)
        }))
    });

    panoViewer.on('mousedown', (e) => {
        if(!editMode) return;
        const c = panoViewer.mouseEventToCoords(e);
        if(c) {
            hotspots.push({ n: "Nouveau", pitch: c[0], yaw: c[1], u: "" });
            initPannellum();
            setTimeout(() => openConfig(hotspots.length - 1, '360'), 200);
        }
    });
}

function syncSVG() {
    const img = document.getElementById('plan-img');
    const svg = document.getElementById('svg-overlay');
    if(!img || img.clientWidth === 0) return;
    svg.setAttribute("viewBox", `0 0 ${img.clientWidth} ${img.clientHeight}`);
    svg.style.width = img.clientWidth + "px";
    svg.style.height = img.clientHeight + "px";
    svg.style.top = img.offsetTop + "px";
    svg.style.left = img.offsetLeft + "px";
    drawZones();
}

function handleMapClick(e) {
    if (infoMode) {
        handleInfoClick(e);
        return;
    }

    if(!editMode || is360Active) return;

    const img = document.getElementById('plan-img');
    const rect = img.getBoundingClientRect();
    const x = Math.round(((e.clientX - rect.left) / rect.width) * 100);
    const y = Math.round(((e.clientY - rect.top) / rect.height) * 100);
    currentPoints.push(`${x},${y}`);
    updateDrawLine();
}

function updateDrawLine() {
    const img = document.getElementById('plan-img');
    const rect = img.getBoundingClientRect();
    const pts = currentPoints.map(p => {
        const [px, py] = p.split(',');
        return `${(px * rect.width) / 100},${(py * rect.height) / 100}`;
    }).join(' ');
    document.getElementById('draw-line').setAttribute("points", pts);
}

window.onkeydown = (e) => {
    if(e.key === "Enter" && editMode && !is360Active && currentPoints.length > 2) {
        zones.push({ n: "Nouveau", points: currentPoints.join(' '), u: "" });
        currentPoints = [];
        document.getElementById('draw-line').setAttribute("points", "");
        drawZones();
        openConfig(zones.length - 1, '2D');
    }
};

function drawZones() {
    const svg = document.getElementById('svg-overlay');
    const img = document.getElementById('plan-img');
    const line = document.getElementById('draw-line');
    if(!img || img.clientWidth === 0) return;
    svg.innerHTML = '';
    svg.appendChild(line);
    zones.forEach((z, i) => {
        const poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
        const pts = z.points.split(' ').map(p => {
            const [px, py] = p.split(',');
            return `${px * img.clientWidth / 100},${py * img.clientHeight / 100}`;
        }).join(' ');
        poly.setAttribute("points", pts);
        poly.setAttribute("class", "zone-poly");
        poly.onclick = (e) => { e.stopPropagation(); editMode ? openConfig(i, '2D') : handleAction(z); };
        svg.appendChild(poly);
    });
}

function toggleEdit() {
    editMode = !editMode;
    document.getElementById('btn-edit').innerHTML = editMode ? '<i class="fas fa-times"></i> Quit' : '<i class="fas fa-pen"></i> Modifier';
    document.getElementById('btn-save').style.display = editMode ? "block" : "none";
    document.getElementById('svg-overlay').style.pointerEvents = editMode ? "all" : "none";
    currentPoints = [];
    updateDrawLine();
}

function openConfig(idx, type) {
    document.getElementById('edit-idx').value = idx;
    document.getElementById('edit-type').value = type || '2D';
    const item = (type === '360') ? hotspots[idx] : zones[idx];
    document.getElementById('zone-name').value = item.n || "";
    document.getElementById('zone-url').value = item.u || "";
    bModal.show();
}

function confirmItem() {
    const i = parseInt(document.getElementById('edit-idx').value);
    const type = document.getElementById('edit-type').value;
    const item = (type === '360') ? hotspots[i] : zones[i];
    item.n = document.getElementById('zone-name').value;
    item.u = document.getElementById('zone-url').value;
    bModal.hide();
    is360Active ? initPannellum() : drawZones();
}

function deleteItem() {
    const i = parseInt(document.getElementById('edit-idx').value);
    const type = document.getElementById('edit-type').value;
    if(type === '360') hotspots.splice(i, 1); else zones.splice(i, 1);
    bModal.hide();
    is360Active ? initPannellum() : drawZones();
}

async function handleAction(item) {
    const url = item.u;
    if(!url) return;
    if(url.includes('.') && !url.includes('/')) {
        await callHA('homeassistant', 'toggle', { entity_id: url });
    } else {
        if(!haModalInstance) haModalInstance = new bootstrap.Modal(document.getElementById('haModal'));
        document.getElementById('haModalTitle').innerText = item.n || "Action";
        document.getElementById('haFrame').src = url;
        haModalInstance.show();
    }
}

function toggleThermo() {
    document.getElementById('thermo-panel').classList.toggle('active');
    document.querySelector('.thermo-backdrop').classList.toggle('active');
}

function adjustTemp(val) {
    const el = document.getElementById('set-val');
    let curr = parseFloat(el.innerText);
    curr = Math.max(5, Math.min(30, curr + val));
    el.innerText = curr.toFixed(1);
}

async function setThermostat() {
    const r = ROOMS[curR];
    const newTemp = parseFloat(document.getElementById('set-val').innerText);
    await callHA("climate", "set_temperature", { entity_id: r.climate, temperature: newTemp });
    toggleThermo();
    setTimeout(updateStatus, 1000);
}

async function launchEve() {
    const r = ROOMS[curR];
    await callHA("button", "press", { entity_id: r.vacuum });
    alert(`🤖 EVE lancée!`);
}

function toggleMobileMenu() {
    document.querySelector('.room-selector').classList.toggle('open');
    document.querySelector('.mobile-overlay').classList.toggle('active');
}

async function initApp() {
    try {
        const res = await fetch('config.json');
        const config = await res.json();
        HA_URL = config.ha_url;
        TOKEN = config.ha_token;
        headers["Authorization"] = `Bearer ${TOKEN}`;
        if (config.rooms && ROOMS.length === 0) ROOMS = config.rooms;
        if (config.weather_entity) WEATHER_ENTITY = config.weather_entity;
    } catch(e) { console.error("Erreur config:", e); }

    await fetchAllEntities();
    await loadRooms();
}

(async () => {
    await initApp();

    const savedBg = localStorage.getItem('bgColor') || 'default';
    applyBackgroundColor(savedBg);

    initRoomSelector();

    const firstRoom = ROOMS[0];
    if (firstRoom && firstRoom.img) {
        const img = document.getElementById('plan-img');
        img.src = firstRoom.img;
        img.onload = () => {
            syncSVG();
            drawInfoOverlays();
        };
    }

    await switchRoom(0);

    const haMod = document.getElementById('haModal');
    if(haMod) haMod.addEventListener('hidden.bs.modal', () => { document.getElementById('haFrame').src = ""; });
    updateHeader();
    fetchWeather();
    setInterval(updateHeader, 10000);
    setInterval(fetchWeather, 600000);
    setInterval(updateStatus, 30000);
    setInterval(drawInfoOverlays, 10000);
    window.addEventListener('resize', () => {
        syncSVG();
        drawInfoOverlays();
    });
})();
</script>
</body>
</html>
